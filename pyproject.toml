[project]
name = "baekend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "beautifulsoup4>=4.12",
    "fastapi>=0.111",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "boto3>=1.34",
    "openai>=1.0,<3.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
