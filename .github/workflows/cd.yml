name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/baekend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > /app/.env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> /app/.env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> /app/.env
            echo "GOOGLE_REDIRECT_URI=https://bbik.cloud/auth/google/callback" >> /app/.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /app/.env
            echo "ENVIRONMENT=production" >> /app/.env
            echo "FRONTEND_URL=https://main.bbik.cloud" >> /app/.env
            echo "CORS_ALLOW_ORIGINS=https://main.bbik.cloud" >> /app/.env
            echo "GOOGLE_AUTH_SUCCESS_URL=https://main.bbik.cloud/auth/callback" >> /app/.env
            echo "PASSWORD_RESET_URL=https://main.bbik.cloud/reset-password" >> /app/.env
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> /app/.env
            echo "OPEN_API_KEY=${{ secrets.OPEN_API_KEY }}" >> /app/.env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> /app/.env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> /app/.env
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> /app/.env
            echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> /app/.env
            echo "DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/baekend:latest" >> /app/.env
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/baekend:latest
            set -a && source /app/.env && set +a
            docker compose -f /app/docker-compose.yml up -d
